<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sistema para Apoio à Aprendizagem de Python - Login Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Barra de navegação corrigida e posicionada no topo dentro do body -->
    <nav class="navbar navbar-expand-lg bg-body-tertiary shadow-sm mb-4">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold text-primary" href="index.html">Login Admin <span class="text-muted fs-6 fw-normal d-none d-lg-inline">| Sistema para Apoio à Aprendizagem de Python</span></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                 <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Início</a></li>
                    <li class="nav-item"><a class="nav-link" href="Banco-de-Questões.html">Banco de Questões</a></li>
                    <li class="nav-item"><a class="nav-link" href="VisualizacaoListas.html">Simulador de Listas</a></li>
                    <li class="nav-item"><a class="nav-link active" href="VisualizacaoDecisao.html">Simulador IF/ELSE</a></li>
                    <li class="nav-item"><a class="nav-link" href="admin.html">Painel Admin</a></li>
                </ul>
            </div>
            </div>
        </div>
    </nav>

    <!-- Container centralizado para o cartão de login -->
    <div class="container d-flex align-items-center justify-content-center" style="min-height: 75vh;">
        <div class="card shadow-sm p-4" style="width: 100%; max-width: 420px;">
            <div class="text-center mb-4">
                <h4 class="fw-bold text-primary">Sistema para Apoio à Aprendizagem de Python</h4>
                <small class="text-secondary d-block">Acesso Restrito ao Administrador</small>
            </div>

            <form id="formLogin">
                <div class="mb-3">
                    <label for="email" class="form-label">E-mail</label>
                    <input type="email" id="email" class="form-control" required placeholder="admin@exemplo.com">
                </div>
                
                <div class="mb-3">
                    <label for="senha" class="form-label">Senha</label>
                    <input type="password" id="senha" class="form-control" required placeholder="Sua senha de admin">
                </div>

                <button type="submit" id="btnLogin" class="btn btn-primary w-100 mb-3">Entrar no Painel</button>
                <a href="index.html" class="btn btn-outline-secondary w-100">Voltar ao site</a>
            </form>

            <div id="mensagemErro" class="mt-3"></div>
        </div>
    </div>

    <!-- SDK do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        const SUPABASE_URL = 'https://rlcfttmkcnqpwzfrsimz.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_BVCIzAUtGWbiCfv4bDtPew_JYZHOf-S';

        const meuSupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        document.getElementById('formLogin').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;
            const btn = document.getElementById('btnLogin');
            const msg = document.getElementById('mensagemErro');

            btn.textContent = 'Verificando...';
            btn.disabled = true;
            msg.innerHTML = '';

            // Consulta a tabela 'admin' criada no Supabase
            const { data, error } = await meuSupabase
                .from('admin')
                .select('*')
                .eq('email', email)
                .eq('senha', senha);

            if (error) {
                msg.innerHTML = `<div class="alert alert-danger p-2 text-center small">Erro ao conectar com o banco de dados.</div>`;
                btn.textContent = 'Entrar no Painel';
                btn.disabled = false;
            } else if (data && data.length > 0) {
                // Login efetuado com sucesso
                localStorage.setItem('adminLogado', 'true');
                window.location.href = 'admin.html';
            } else {
                msg.innerHTML = `<div class="alert alert-danger p-2 text-center small">E-mail ou senha incorretos!</div>`;
                btn.textContent = 'Entrar no Painel';
                btn.disabled = false;
            }
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
